[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-decoratormixins"
version = "1.0.1.dev0"
description = "A collection of decorator mixins for Django views."
readme = "README.rst"
license = {text = "BSD"}
authors = [{name = "Fusionbox, Inc.", email = "programmers@fusionbox.com"}]
keywords = ["django", "decorator", "mixin", "class-based-views", "class", "based", "views"]
requires-python = ">=3.8"
dependencies = ["Django>=2.2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/fusionbox/django-decoratormixins"

[tool.setuptools]
packages = ["decoratormixins"]
